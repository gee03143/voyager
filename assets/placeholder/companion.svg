<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <!-- tail -->
  <path d="M86 74 Q116 84 108 118 Q97 99 81 87 Z" fill="#3A3A3A"/>
  <path d="M100 100 Q107 108 104 117 Q99 111 95 103 Z" fill="#EDEDED"/>

  <!-- branch -->
  <rect x="16" y="118" width="72" height="10" rx="5" fill="#8B5E3C"/>
  <rect x="16" y="118" width="72" height="4" rx="2" fill="#A97C52"/>

  <!-- body -->
  <ellipse cx="55" cy="68" rx="37" ry="39" fill="#F7EFE3"/>

  <!-- subtle belly texture lines -->
  <path d="M34 82 Q55 90 76 82" stroke="#E4D4BE" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M38 92 Q55 98 72 92" stroke="#E4D4BE" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- pink blush wash on sides -->
  <ellipse cx="26" cy="72" rx="11" ry="15" fill="#F0B8AE" opacity="0.5"/>
  <ellipse cx="84" cy="72" rx="11" ry="15" fill="#F0B8AE" opacity="0.5"/>

  <!-- head cap -->
  <path d="M27 36 Q55 8 83 36 Q83 48 55 48 Q27 48 27 36 Z" fill="#3A3A3A"/>

  <!-- eye masks -->
  <ellipse cx="31" cy="52" rx="10" ry="14" fill="#3A3A3A" transform="rotate(-18 31 52)"/>
  <ellipse cx="79" cy="52" rx="10" ry="14" fill="#3A3A3A" transform="rotate(18 79 52)"/>

  <!-- eyes -->
  <circle cx="40" cy="53" r="8" fill="#FFFFFF"/>
  <circle cx="70" cy="53" r="8" fill="#FFFFFF"/>
  <circle cx="41" cy="54" r="6" fill="#1E1E1E"/>
  <circle cx="71" cy="54" r="6" fill="#1E1E1E"/>
  <circle cx="43" cy="51.5" r="2" fill="#FFFFFF"/>
  <circle cx="73" cy="51.5" r="2" fill="#FFFFFF"/>

  <!-- beak -->
  <path d="M49 63 L61 63 L55 72 Z" fill="#3A3A3A"/>

  <!-- feet -->
  <path d="M42 104 L40 118 M42 104 L45 118" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M68 104 L66 118 M68 104 L71 118" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
